# Pinned toolchain (PLAN 0.5). Each line is checkable: `make versions` compares the constraint against what is
# actually installed, and `make ci` checks that this file still parses and pins nothing it does not mean to.
#
#   tool              constraint    source                       stage / notes
#
# A constraint is one of:  >=X.Y[.Z]   <=X.Y[.Z]   ==X.Y[.Z]   ~=X.Y   (a bare X.Y.Z means ==). `UNPINNED` says the
# tool is used but its version is not established -- which is a finding, not a placeholder: the note says why.
# `none` says the tool is deliberately absent (a blocked phase), not forgotten.
