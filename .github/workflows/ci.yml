name: ci

# The checks that need no game data. AGENTS.md forbids CI from downloading the game, a BIOS or an SDK
# library, so the dump-side checks (manifest verify, package parse, decompile coverage) cannot run here
# and are not pretended to: `make ci` prints them as skipped, and lists what it did check.
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: checks that need no game data
        run: make ci
